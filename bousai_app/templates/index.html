{% extends "base.html" %}

{% block content %}
<style>
  .map-section {
    margin-bottom: 60px;
  }
  
  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #1e5fa0;
  }
  
  .section-icon {
    font-size: 28px;
  }
  
  #shelterMap {
    height: 320px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    border: 1px solid #e0e0e0;
  }
  
  .weather-section {
    margin-top: 50px;
  }
  
  .weather-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
  }
  
  .weather-header .auto-update {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    color: #2c7a2c;
    font-weight: 500;
  }
  
  .weather-header .auto-update .icon {
    font-size: 18px;
  }
  
  #weatherContent {
    background-color: #f9f9f9;
    padding: 24px;
    border-radius: 8px;
    border-left: 4px solid #2c7a2c;
  }
  
  #weatherContent p {
    margin: 12px 0;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 15px;
    color: #333;
  }
  
  #weatherContent ul {
    margin: 16px 0;
    padding-left: 0;
    list-style: none;
  }
  
  #weatherContent li {
    margin: 10px 0;
    padding-left: 20px;
    position: relative;
    color: #333;
  }
  
  #weatherContent li:before {
    content: "✓";
    position: absolute;
    left: 0;
    color: #2c7a2c;
    font-weight: bold;
  }
  
  .weather-info-icon {
    font-size: 16px;
    min-width: 20px;
  }
  
  @media (max-width: 768px) {
    #shelterMap {
      height: 250px;
    }
    
    .section-title {
      font-size: 18px;
    }
    
    .weather-header {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>

<!-- 避難所マップ -->
<div class="map-section">
  <div class="section-title">
    <span class="section-icon">📍</span>
    <span>避難所マップ</span>
  </div>
  <div id="shelterMap"></div>
</div>

<!-- 気象警報・注意報 -->
<div class="weather-section">
  <div class="weather-header">
    <div class="section-title">
      <span class="section-icon">⛈️</span>
      <span id="weather-title">青森市 気象警報・注意報</span>
    </div>
    <div class="auto-update">
      <span class="icon">🔄</span>
      <span>10分おき自動更新</span>
    </div>
  </div>
  <div id="weatherContent">
    <p>読み込み中...</p>
  </div>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（藤沢市周辺を中心に設定）
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p><span class="weather-info-icon">✓</span>現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p><span class="weather-info-icon">📍</span>${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p><span class="weather-info-icon">⏰</span>データ取得: ${data.last_fetch_time || '更新中...'}</p>
            <p><span class="weather-info-icon">🌡️</span>気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
